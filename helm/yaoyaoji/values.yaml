# Default values for yaoyaoji.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: production

# MySQL Configuration
mysql:
  image: mysql:8.0
  imagePullPolicy: IfNotPresent
  storage:
    size: 10Gi
    storageClass: standard
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# Backend Configuration
backend:
  replicaCount: 3
  image:
    repository: yaoyaoji-backend
    tag: latest
    pullPolicy: IfNotPresent
  storage:
    size: 5Gi
    storageClass: standard
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3

# Frontend Configuration
frontend:
  replicaCount: 2
  image:
    repository: yaoyaoji-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  host: yaoyaoji.local
  tls:
    enabled: false
    secretName: yaoyaoji-tls

# Application Configuration (stored in ConfigMap)
config:
  database: yaoyaoji
  appName: "药药记 API"
  appVersion: "1.0.0"
  algorithm: "HS256"
  accessTokenExpireMinutes: "1440"
  deepseekBaseUrl: "https://api.deepseek.com"
  debug: "false"

# Secrets (base64 encoded in Secret)
# WARNING: Change these values in production!
secrets:
  mysqlPassword: yaoyaoji123
  secretKey: your-secret-key-change-in-production
  deepseekApiKey: sk-your-api-key

# Database Initialization Job
initJob:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 100
