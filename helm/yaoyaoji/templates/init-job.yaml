{{- if .Values.initJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "yaoyaoji.fullname" . }}-init-db
  labels:
    {{- include "yaoyaoji.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: init-db
        {{- include "yaoyaoji.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z {{ include "yaoyaoji.fullname" . }}-mysql 3306; do
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done
          echo "MySQL is ready!"
      containers:
      - name: init-db
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        command: ["python", "run_all_migrations.py"]
        envFrom:
        - configMapRef:
            name: {{ include "yaoyaoji.fullname" . }}-config
        - secretRef:
            name: {{ include "yaoyaoji.fullname" . }}-secret
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://root:$(MYSQL_PASSWORD)@$(MYSQL_HOST):$(MYSQL_PORT)/$(MYSQL_DATABASE)"
{{- end }}
