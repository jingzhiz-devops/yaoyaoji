apiVersion: v1
kind: Service
metadata:
  name: {{ include "yaoyaoji.fullname" . }}-mysql
  labels:
    {{- include "yaoyaoji.mysql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    app: mysql
    {{- include "yaoyaoji.selectorLabels" . | nindent 4 }}
